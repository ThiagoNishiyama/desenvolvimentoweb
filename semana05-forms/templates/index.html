{% extends "base.html" %}
{% block content %}
<h1>Hello, {{ name or 'Stranger' }}!</h1>
<form method="POST">
    {{ form.hidden_tag() }}
    <div class="mb-3">
        {{ form.name.label }}
        {{ form.name(class="form-control", style="width:300px") }}
    </div>
    {{ form.submit(class="btn btn-primary") }}
</form>
{% endblock %}
